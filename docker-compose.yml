# 단일 노드(클러스터 아님) 성능 테스트용 인프라
# 포트: 원래 포트 앞에 3을 붙임
services:
  mariadb:
    image: mariadb:11
    container_name: bench-mariadb
    # 1M건 행이 기본 버퍼 풀(128MB)에 들어가지 않아 1G로 늘림
    command: ["--innodb-buffer-pool-size=1G"]
    environment:
      MARIADB_ROOT_PASSWORD: "1234"
      MARIADB_DATABASE: bench
    ports:
      - "33307:3306"
    volumes:
      - mariadb-data:/var/lib/mysql

  redis:
    image: redis:7-alpine
    container_name: bench-redis
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "36397:6379"
    volumes:
      - redis-data:/data

  kafka:
    image: apache/kafka:3.9.0   # KRaft 단일 노드 (zookeeper 불필요)
    container_name: bench-kafka
    ports:
      - "39092:39092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:39092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:39092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 10
    volumes:
      - kafka-data:/var/lib/kafka/data

  rabbitmq:
    image: rabbitmq:3-management
    container_name: bench-rabbitmq
    ports:
      - "35672:5672"     # AMQP
      - "31567:15672"    # 관리 UI (315672는 포트 범위 초과라 31567 사용)
    volumes:
      - rabbit-data:/var/lib/rabbitmq

volumes:
  mariadb-data:
  redis-data:
  kafka-data:
  rabbit-data:
