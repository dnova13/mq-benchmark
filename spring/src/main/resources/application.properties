# 공통 설정. MQ별 설정은 아래 파일로 나눠 두었다(필요한 MQ 파일만 다른 프로젝트로 복사해 쓴다).
spring.application.name=mq-bench-spring
spring.config.import=classpath:application-kafka.properties,classpath:application-rabbitmq.properties,classpath:application-redis.properties

server.port=8080

# ===== MariaDB =====
spring.datasource.url=jdbc:mariadb://localhost:33307/bench
spring.datasource.username=root
spring.datasource.password=1234
# Nest mysql2 풀(10)과 동일
spring.datasource.hikari.maximum-pool-size=10
