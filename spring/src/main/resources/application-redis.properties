# ===== Redis Streams (com.bench.mq.redis) =====
# false면 컨슈머 그룹, 리스너 컨테이너, 발행을 등록하지 않는다
mq.redis.enabled=true
mq.redis.stream-key=bench:stream
mq.redis.group=bench-spring-group
# 같은 그룹 컨슈머 수, XREADGROUP COUNT, 블로킹 대기
mq.redis.workers=10
mq.redis.batch-size=100
mq.redis.poll-timeout=1s

spring.data.redis.host=localhost
spring.data.redis.port=36397
