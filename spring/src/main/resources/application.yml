server:
  port: 8080

spring:
  datasource:
    url: jdbc:mariadb://localhost:33307/bench
    username: root
    password: "1234"
    hikari:
      maximum-pool-size: 10   # Nest mysql2 풀(10)과 동일
  data:
    redis:
      host: localhost
      port: 36397
  kafka:
    bootstrap-servers: localhost:39092
    consumer:
      group-id: bench-spring-group
      auto-offset-reset: latest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
    listener:
      concurrency: 10         # 파티션 10개와 동일
  rabbitmq:
    host: localhost
    port: 35672
    username: guest
    password: guest
    listener:
      simple:
        prefetch: 100
        concurrency: 10
        max-concurrency: 10
